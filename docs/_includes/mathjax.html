<!-- for mathjax support -->
{% if page.usemathjax %}
<script>
MathJax = {
  tex: {
    inlineMath: {'[+]': [['$', '$']]}
  },
  svg: {
    fontCache: 'global'
  }
};
</script>
<script id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js">
</script>
{% endif %}
